name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: c6
            path: c6-slave
            target: esp32c6
          - name: p4
            path: p4-app
            target: esp32p4
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}

      - name: Dump esp-serial-flasher API (debug)
        if: always()
        run: |
          echo "===== headers mentioning sdio ====="
          hdrs=$(grep -rilE 'sdio' $(find ${{ matrix.path }} -path '*esp-serial-flasher*' -name '*.h') 2>/dev/null)
          echo "$hdrs"
          for h in $hdrs; do echo "----- $h -----"; cat "$h"; done
          echo "===== esp_loader_flash_cfg_t ====="
          find ${{ matrix.path }} -path '*esp-serial-flasher*' -name 'esp_loader.h' -exec sed -n '130,150p' {} + 2>/dev/null || true

      - name: Merge ${{ matrix.name }} image
        run: |
          python -m pip install --quiet esptool
          cd ${{ matrix.path }}/build
          esptool.py --chip ${{ matrix.target }} merge_bin \
            -o ../../merged-${{ matrix.name }}.bin \
            --fill-flash-size 16MB @flash_args
          ls -la ../../merged-${{ matrix.name }}.bin

      - name: Upload ${{ matrix.name }} binary
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-${{ matrix.name }}
          path: merged-${{ matrix.name }}.bin

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect binaries into the web flasher
        uses:
