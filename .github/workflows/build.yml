name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: c6
            path: c6-slave
            target: esp32c6
          - name: p4
            path: p4-app
            target: esp32p4
    steps:
      - uses: actions/checkout@v4

      # Upgrade idf-component-manager before building. The version bundled in the
      # v5.5 image aborts dependency resolution when an optional dependency's `if`
      # clause references a Kconfig symbol that lives in a not-yet-downloaded
      # component (LVGL's LV_USE_FREETYPE, pulled via the Tab5 BSP):
      #   MissingKconfigError: LV_USE_FREETYPE
      # Newer managers treat the unknown symbol as unset instead of erroring.
      # PIP_CONSTRAINT is cleared so IDF's pinned constraint doesn't block it.
      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: "PIP_CONSTRAINT= pip install -U idf-component-manager && idf.py build"

      - name: Merge ${{ matrix.name }} image
        run: |
          python -m pip install --quiet esptool
          cd ${{ matrix.path }}/build
          esptool.py --chip ${{ matrix.target }} merge_bin \
            -o ../../merged-${{ matrix.name }}.bin \
            @flash_args
          ls -la ../../merged-${{ matrix.name }}.bin

      - name: Upload ${{ matrix.name }} binary
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-${{ matrix.name }}
          path: merged-${{ matrix.name }}.bin

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect binaries into the web flasher
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r webflasher/* _site/
          cp _artifacts/honeycomb-p4/merged-p4.bin _site/merged-p4.bin
          cp _artifacts/honeycomb-c6/merged-c6.bin _site/merged-c6.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
