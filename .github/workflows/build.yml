name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: c6
            path: c6-slave
            target: esp32c6
          - name: p4
            path: p4-app
            target: esp32p4
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}

      - name: Dump esp-serial-flasher API (debug)
        if: always()
        run: |
          echo "===== port/esp32_port.h ====="
          find ${{ matrix.path }} -path '*esp-serial-flasher*' -name 'esp32_port.h' -exec cat {} + 2>/dev/null || true
          echo "===== include/esp_loader.h (api) ====="
          find ${{ matrix.path }} -path '*esp-serial-flasher*' -name 'esp_loader.h' \
            -exec grep -nE 'init_sdio|init_serial|flash_cfg|flash_start|flash_write|flash_finish|reset_target|_port_t|typedef' {} + 2>/dev/null || true

      - name: Merge ${{ matrix.name }} image
        run: |
          python -m pip install --quiet esptool
          cd ${{ matrix.path }}/build
          esptool.py --chip ${{ matrix.target }} merge_bin \
            -o ../../merged-${{ matrix.name }}.bin \
            --fill-flash-size 16MB @flash_args
          ls -la ../../merged-${{ matrix.name }}.bin

      - name: Upload ${{ matrix.name }} binary
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-${{ matrix.name }}
          path: merged-${{ matrix.name }}.bin

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect binaries into the web flasher
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r webflasher/* _site/
          cp _artifacts/honeycomb-p4/merged-p4.bin _site/merged-p4.bin
          cp _artifacts/honeycomb-c6/merged-c6.bin _site/merged-c6.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
